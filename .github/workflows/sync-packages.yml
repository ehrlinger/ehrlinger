name: sync-packages

# The package tables in README.md are generated from hvtiR's published
# manifest. This job proposes an update whenever that manifest changes, and
# fails the build if someone hand-edits inside the generated markers.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # On a PR or push, only verify. Never rewrite the file under review.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the renderer
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Verify README matches the manifest
        run: python3 tools/render_packages.py --check

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Test the renderer
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      # render_packages.py fails loudly on a fetch error or a malformed
      # manifest, so a network blip cannot publish a shortened table.
      - name: Render README from the manifest
        run: python3 tools/render_packages.py

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-packages
          delete-branch: true
          title: "chore: sync the package tables with hvtiR's manifest"
          commit-message: |
            chore: sync the package tables with hvtiR's manifest

            Generated by tools/render_packages.py from
            https://ehrlinger.github.io/hvtiR/members.json. Edit
            inst/extdata/catalog.csv in ehrlinger/hvtiR rather than this file:
            anything between the BEGIN:packages markers is overwritten.
          body: |
            The package tables in `README.md` no longer match hvtiR's published
            manifest, so this PR regenerates them.

            The source of truth is `inst/extdata/catalog.csv` in
            [ehrlinger/hvtiR](https://github.com/ehrlinger/hvtiR); this file is
            a rendering of it. To change wording, change the catalog.
